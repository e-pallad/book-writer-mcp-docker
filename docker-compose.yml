services:
  book-writer-mcp:
    build: .
    # Published by CI on every merge to main; deploy/truenas/auto-update.sh
    # pulls it. Set BOOK_MCP_TAG=sha-<commit> in .env to pin a version.
    image: ghcr.io/e-pallad/book-writer-mcp-docker:${BOOK_MCP_TAG:-latest}
    container_name: book-writer-mcp
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BOOK_PROJECT_DIR: /app/data
    ports:
      - "${PORT:-3456}:${PORT:-3456}"
    volumes:
      - ./data:/app/data

  # Exposes book-writer-mcp at a public HTTPS hostname without opening any
  # inbound ports. Create the tunnel and its public hostname in the
  # Cloudflare Zero Trust dashboard first (see README), then set
  # CLOUDFLARE_TUNNEL_TOKEN in .env. Omit this service if you're fronting
  # the container with your own reverse proxy instead.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: book-mcp-cloudflared
    restart: unless-stopped
    # Metrics stay inside the container; the health check reads /ready from
    # them, so deploy/truenas/auto-update.sh can tell a working tunnel from a
    # broken release. The image has no shell, hence the exec-form test.
    command: tunnel --no-autoupdate --metrics 127.0.0.1:60123 run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:60123", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
      start_interval: 5s
    depends_on:
      - book-writer-mcp
